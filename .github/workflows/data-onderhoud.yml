name: Data-onderhoud

# Draait de onderhoudsfuncties die al live staan, zodat je er geen terminal
# voor nodig hebt. Actions → Data-onderhoud → Run workflow.
#
# De acties in volgorde waarin je ze normaal draait:
#   audit          kijken hoe de dataset ervoor staat (schrijft niets)
#   dubbelen-droog rapport van dubbele documenten (schrijft niets)
#   dubbelen-echt  voegt de dubbelen samen en verwijdert de restanten
#   sweep          haalt bekendmakingen op en verwerkt nieuwe documenten
#   herbouw        leidt de toestand per gemeente opnieuw af (geen AI-calls)

on:
  workflow_dispatch:
    inputs:
      actie:
        description: Welke actie
        required: true
        default: audit
        type: choice
        options:
          - audit
          - dubbelen-droog
          - dubbelen-echt
          - sweep
          - herbouw
      vanaf:
        description: 'Alleen bij sweep — begindatum (JJJJ-MM-DD), leeg = vanaf het watermerk'
        required: false
        default: ''
      max:
        description: 'Alleen bij sweep — documenten per run. Hoger dan ~50 loopt tegen de 9-minuten functietimeout aan.'
        required: false
        default: '40'
      bevestig:
        description: 'Alleen bij dubbelen-echt — typ VERWIJDER om te bevestigen'
        required: false
        default: ''

env:
  BASIS: https://us-central1-pfas-dashboard-nl-a808d.cloudfunctions.net

jobs:
  onderhoud:
    name: ${{ inputs.actie }}
    runs-on: ubuntu-latest

    steps:
      # dubbelen-echt verwijdert documenten. Dat mag niet per ongeluk.
      - name: Bevestiging controleren
        if: inputs.actie == 'dubbelen-echt' && inputs.bevestig != 'VERWIJDER'
        run: |
          echo "::error::dubbelen-echt verwijdert documenten. Typ VERWIJDER in het bevestigingsveld."
          exit 1

      - name: Uitvoeren
        run: |
          set -eu
          case "${{ inputs.actie }}" in
            audit)          URL="$BASIS/auditData" ;;
            dubbelen-droog) URL="$BASIS/mergeDuplicateDocs" ;;
            dubbelen-echt)  URL="$BASIS/mergeDuplicateDocs?apply=true" ;;
            herbouw)        URL="$BASIS/herbouwAfwijkingenNow" ;;
            sweep)
              # Elk nieuw document kost een fetch, een AI-call en een pauze voor
              # de rate limit: zo'n 5 a 10 seconden. De functie stopt na 9 minuten
              # (het maximum voor een v1-function), dus meer dan ~50 per run leidt
              # tot een timeout voordat er antwoord komt.
              URL="$BASIS/sweepBekendmakingenNow?max=${{ inputs.max }}"
              if [ -n "${{ inputs.vanaf }}" ]; then
                URL="$URL&vanaf=${{ inputs.vanaf }}"
              fi
              ;;
          esac

          echo "GET $URL"
          # Deze functies kunnen minuten draaien; ruime timeout.
          CODE=$(curl -sS -o /tmp/uitkomst.json -w '%{http_code}' --max-time 900 "$URL" || echo 000)
          echo "HTTP $CODE"
          echo "$CODE" > /tmp/code.txt

      - name: Resultaat tonen
        if: always()
        run: |
          CODE=$(cat /tmp/code.txt 2>/dev/null || echo 000)
          {
            echo "## ${{ inputs.actie }}"
            echo ""
            echo "HTTP \`$CODE\`"
            echo ""
            echo '```json'
            # Niet alles: sommige rapporten bevatten honderden regels detail.
            head -c 6000 /tmp/uitkomst.json 2>/dev/null || echo '(geen uitvoer)'
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          node -e "
            const fs = require('fs');
            let d; try { d = JSON.parse(fs.readFileSync('/tmp/uitkomst.json', 'utf8')); } catch { process.exit(0); }
            if (d.samenvatting) console.log('samenvatting:', JSON.stringify(d.samenvatting, null, 1));
            if (d.resultaat)   console.log('resultaat:',   JSON.stringify(d.resultaat, null, 1));
            if (d.modus)       console.log('modus:', d.modus, '| dubbelen:', d.gemeentenMetDubbelen, '| te verwijderen:', d.documentenTeVerwijderen);
          " || true

          # 408/504 = de functie draaide nog toen de 9 minuten om waren. Verwerkte
          # documenten zijn per stuk opgeslagen, dus dit is geen verloren werk maar
          # een halve run. Opnieuw starten pakt de draad op.
          case "$CODE" in
            200) ;;
            408|504)
              echo "::warning::De functie liep tegen de timeout van 9 minuten. Wat verwerkt was is bewaard; start dezelfde actie opnieuw, eventueel met een lagere waarde bij 'max'."
              {
                echo ""
                echo "> **Timeout, geen fout.** De functie draaide nog toen de 9 minuten om waren."
                echo "> Verwerkte documenten zijn opgeslagen. Start dezelfde actie opnieuw"
                echo "> tot \`verwerkt: 0\` verschijnt; verlaag zo nodig \`max\`."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) echo "::error::De functie gaf HTTP $CODE"; exit 1 ;;
          esac
