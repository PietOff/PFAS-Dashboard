name: Review mogelijk afwijkend beleid

# Zet per gemeente met 'mogelijk-afwijkend' beleid de passages met PFAS-waarden
# uit het brondocument op een rij, plus de eigen publicaties van die gemeente.
# Beslist niets: het is leesvoer om per gemeente te bepalen of het beleid echt
# afwijkt. Draait hier omdat overheid.nl vanaf de runner bereikbaar is.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'pfasApi_code/review-mogelijk.js'
      - '.github/workflows/review-mogelijk.yml'

permissions:
  contents: read

jobs:
  review:
    name: Bewijs verzamelen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pfasApi_code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pfasApi_code/package-lock.json
      - run: npm ci
      - name: Bewijs per gemeente
        run: node review-mogelijk.js --uit=/tmp/review.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-mogelijk
          path: /tmp/review.json
          retention-days: 30
